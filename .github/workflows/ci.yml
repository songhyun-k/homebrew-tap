name: Tap CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use the checked-out tap
        run: brew tap songhyun-k/tap "$GITHUB_WORKSPACE"
      - name: Install, audit and exercise the release
        run: |
          brew install songhyun-k/tap/muse
          brew audit --strict songhyun-k/tap/muse
          brew test songhyun-k/tap/muse
